<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050810; }
    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 80% at 50% 110%, #1a1040 0%, transparent 55%),
        radial-gradient(ellipse 80% 50% at 20% 0%, #0d2840 0%, transparent 50%),
        linear-gradient(180deg, #030508 0%, #0a0e1a 45%, #120a20 100%);
    }
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 30% 65%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 55% 15%, rgba(200,240,255,0.8), transparent),
        radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 85% 35%, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 45% 45%, rgba(160,200,255,0.35), transparent);
      animation: drift 120s linear infinite;
    }
    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-40px); }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="stars"></div>
</body>
</html>
