<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Holographic Orb</title>
<style>
  :root {
    --blue:#009bd8; --blue-bright:#34c0ff; --magenta:#9a4ab8;
    --violet:#7c4dff; --pink:#d56cff; --warm:#ffd08a; --core:#04060e;
  }
  * { margin:0;padding:0;box-sizing:border-box; }
  html,body { width:2560px;height:1440px;background:transparent;overflow:hidden; }
  .stage { position:relative;width:2560px;height:1440px;overflow:visible; }
  .wrap {
    position:absolute;width:378px;height:378px;left:1960px;top:1040px;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 18px 32px rgba(0,0,0,0.42));
    will-change:left,top,transform;
  }
  .fx-canvas { position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6; }
  .halo {
    position:absolute;width:295px;height:295px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,160,96,0.08) 0%,rgba(42,168,216,0.06) 38%,transparent 68%);
    filter:blur(10px);will-change:transform,opacity;z-index:0;
  }
  .ring-shell { position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:1;will-change:transform,opacity; }
  .ring-shell.s1 { width:286px;height:286px; }
  .ring-shell.s2 { width:309px;height:309px; }
  .ring {
    position:relative;
    width:100%;height:100%;border-radius:50%;border:1px solid rgba(42,168,216,0.16);
    box-shadow:0 0 6px rgba(42,168,216,0.08), inset 0 0 4px rgba(42,168,216,0.04);
    animation:spin 26s linear infinite;
  }
  .ring::after {
    content:"";position:absolute;inset:-2px;border-radius:50%;
    background:conic-gradient(from 28deg,transparent 0 58%,rgba(52,192,255,0.36) 64%,transparent 70% 100%);
    -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%,#000 68%,transparent 70%);
    mask:radial-gradient(circle,transparent 62%,#000 64%,#000 68%,transparent 70%);
    opacity:0.72;
  }
  .ring-shell.s2 .ring {
    border-color:rgba(224,64,251,0.22);
    box-shadow:0 0 10px rgba(224,64,251,0.12), inset 0 0 6px rgba(224,64,251,0.06);
    animation:spin 36s linear infinite reverse;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .orb-body {
    position:relative;width:252px;height:252px;border-radius:50%;overflow:hidden;
    will-change:transform,filter; isolation:isolate; z-index:3; background:var(--core);
    box-shadow:0 0 22px rgba(42,168,216,0.18),0 0 40px rgba(154,74,184,0.12),
      inset 0 0 0 2px rgba(42,168,216,0.22), inset 0 0 32px rgba(0,0,0,0.95);
  }
  .orb-body::after {
    content:"";position:absolute;inset:0;border-radius:50%;z-index:6;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,0.055) 0 1px,transparent 1px 7px);
    mix-blend-mode:screen;opacity:0.10;
  }
  .orb-occlude {
    position:absolute;inset:8%;border-radius:50%;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 50% 52%,#03050a 0%,#050912 55%,rgba(5,9,18,0.98) 100%);
    box-shadow:inset 0 0 24px rgba(0,0,0,0.65);
  }
  .orb-depth {
    position:absolute;inset:0;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 50% 58%,#020408 0%,#040810 42%,#060c18 68%,#0a101e 100%);
  }
  .stars { position:absolute;inset:0;width:100%;height:100%;border-radius:50%;z-index:3;pointer-events:none; }
  .plasma {
    position:absolute;inset:-6px;border-radius:50%;z-index:4;pointer-events:none;
    background:conic-gradient(from 0deg,transparent 0%,rgba(52,192,255,0.65) 6%,transparent 14%,
      rgba(224,64,251,0.55) 26%,transparent 34%,rgba(52,192,255,0.5) 50%,transparent 58%,
      rgba(192,38,211,0.6) 72%,transparent 80%,rgba(52,192,255,0.45) 92%,transparent 100%);
    filter:blur(2px);mix-blend-mode:screen;opacity:0.55;
    -webkit-mask:radial-gradient(circle,transparent 54%,#000 68%,#000 100%);
    mask:radial-gradient(circle,transparent 54%,#000 68%,#000 100%);
    animation:plasmaSpin 14s linear infinite;
  }
  @keyframes plasmaSpin { to{transform:rotate(360deg)} }
  .orb-glass {
    position:absolute;inset:0;border-radius:50%;z-index:5;pointer-events:none;
    background:radial-gradient(circle at 28% 22%,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0.06) 18%,transparent 42%),
      radial-gradient(circle at 72% 78%,rgba(224,64,251,0.12) 0%,transparent 36%);
    mix-blend-mode:screen;
  }
  .orb-rim-light {
    position:absolute;inset:0;border-radius:50%;z-index:5;pointer-events:none;
    box-shadow:inset 0 -18px 28px rgba(0,171,253,0.12), inset 0 16px 22px rgba(224,64,251,0.08);
  }
  .face {
    position:absolute;top:50%;left:50%;width:148px;height:128px;margin:-66px 0 0 -74px;
    will-change:transform;z-index:7;
  }
  .brow {
    position:absolute;top:6px;height:8px;width:34px;pointer-events:none;
    filter:drop-shadow(0 0 5px rgba(52,192,255,0.5));
  }
  .brow svg { width:100%;height:100%;overflow:visible; }
  .brow-path { fill:none;stroke:url(#browGrad);stroke-width:3.2;stroke-linecap:round; }
  .brow.l { left:18px; }
  .brow.r { right:18px; }
  .eye {
    position:absolute;top:34px;width:20px;height:20px;border-radius:50%;
    box-shadow:0 0 14px currentColor,0 0 24px currentColor,inset 0 0 5px rgba(255,255,255,0.4);
    will-change:transform;
    transform:translate(var(--ex,0px),var(--ey,0px));
  }
  .eye.l { left:32px;color:var(--blue-bright);background:radial-gradient(circle at 35% 30%,#fff 0%,var(--blue-bright) 38%,#0088cc 100%); }
  .eye.r { right:32px;color:var(--pink);background:radial-gradient(circle at 35% 30%,#fff 0%,var(--pink) 38%,#a020b8 100%); }
  .eye.blink { animation:eyeBlink 120ms ease-in-out forwards; }
  .eye.wide { transform:translate(var(--ex,0px),var(--ey,0px)) scale(1.18,1.1); }
  .eye.emphasis { transform:translate(var(--ex,0px),var(--ey,0px)) scale(1.08,1.06); }
  .face { transition:transform 0.2s ease-out; }
  .eye.squint { transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(0.55);border-radius:40%; }
  @keyframes eyeBlink { 0%{transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(1)} 45%{transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(0.05)} 100%{transform:translate(var(--ex,0px),var(--ey,0px)) scaleY(1)} }
  .mouth-wrap { position:absolute;left:50%;bottom:8px;width:84px;height:48px;margin-left:-42px; }
  .mouth-wrap svg { width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px rgba(0,171,253,0.55)) drop-shadow(0 0 10px rgba(192,38,211,0.4)); }
  .mouth-inner { fill:#020408;opacity:0; }
  .mouth-inner.open { opacity:1; }
  .lip-upper,.lip-lower { fill:none;stroke:url(#mouthGrad);stroke-width:4;stroke-linecap:round; }
  .teeth { fill:rgba(210,235,255,0.14);opacity:0; }
  .teeth.show { opacity:1; }
  .orb-body.idle { animation:breathe 6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(0.992);filter:brightness(0.94) saturate(1.02)} 50%{transform:scale(1.006);filter:brightness(0.97) saturate(1.04)} }
  @media (prefers-reduced-motion: reduce) {
    .ring, .plasma, .orb-body.idle { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <canvas class="fx-canvas" id="fx" width="378" height="378"></canvas>
      <div class="halo" id="halo"></div>
      <div class="ring-shell s2" id="ring2"><div class="ring"></div></div>
      <div class="ring-shell s1" id="ring1"><div class="ring"></div></div>
      <div class="orb-body idle" id="orb">
        <div class="orb-depth"></div>
        <div class="orb-occlude"></div>
        <canvas class="stars" id="stars" width="252" height="252"></canvas>
        <div class="plasma" id="plasma"></div>
        <div class="orb-glass"></div>
        <div class="orb-rim-light"></div>
        <div class="face" id="face">
          <div class="brow l" id="browL"><svg viewBox="0 0 34 8"><defs><linearGradient id="browGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34c0ff"/><stop offset="100%" stop-color="#e040fb"/></linearGradient></defs><path class="brow-path" id="browPathL" d="M 2 5 Q 17 2 32 5"/></svg></div>
          <div class="brow r" id="browR"><svg viewBox="0 0 34 8"><path class="brow-path" id="browPathR" d="M 2 5 Q 17 2 32 5"/></svg></div>
          <div class="eye l" id="eyeL"></div>
          <div class="eye r" id="eyeR"></div>
          <div class="mouth-wrap">
            <svg viewBox="0 0 80 44">
              <defs><linearGradient id="mouthGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34c0ff"/><stop offset="100%" stop-color="#e040fb"/></linearGradient></defs>
              <path class="mouth-inner" id="mouthInner" d="M 20 18 Q 40 18 60 18 Q 40 38 20 18 Z"/>
              <path class="teeth" id="teeth" d="M 26 19 Q 40 20 54 19 L 54 24 Q 40 25 26 24 Z"/>
              <path class="lip-upper" id="lipUpper" d="M 18 18 Q 40 14 62 18"/>
              <path class="lip-lower" id="lipLower" d="M 22 18 Q 40 28 58 18"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
<script src="branding.js"></script>
<script>
(function(){
  "use strict";
  var C=window.BRANDING||{};
  var onHttp=(location.protocol==="http:"||location.protocol==="https:");
  var LEVEL_SRCS=onHttp
    ?["/level.json","level-live.json","http://127.0.0.1:18765/level.json"]
    :["level-live.json","http://127.0.0.1:18765/level.json"];
  var levelSrc=0, POLL_MS=33, RETRY_MS=300;
  var ATTACK=0.35, RELEASE=0.1, MOUTH_ATTACK=0.78, MOUTH_RELEASE=0.12, IDLE_THRESHOLD=0.01;
  var SPEAK_ON=0.045, SPEAK_OFF=0.02;
  function cfgNumber(name,fallback,min,max){
    var v=Number(C[name]);
    if(!isFinite(v)) v=fallback;
    return clamp(v,min,max);
  }
  var VOICE_SENSITIVITY=1;
  var ORB_SCALE=1;
  var GLOW_INTENSITY=1;
  var POSITION_PRESETS={
    lowerRight:{x:1965,y:1045,rx:72,ry:54},
    rightEdge:{x:2210,y:1140,rx:44,ry:34},
    centerRight:{x:2105,y:730,rx:58,ry:44},
    lowerCenter:{x:1280,y:1060,rx:62,ry:34}
  };
  var POS=POSITION_PRESETS.lowerRight;
  function applyConfig(next){
    if(next&&typeof next==="object") C=Object.assign({},C,next);
    VOICE_SENSITIVITY=cfgNumber("voiceSensitivity",1,0.45,2.4);
    ORB_SCALE=cfgNumber("orbScale",1,0.72,1.4);
    GLOW_INTENSITY=cfgNumber("glowIntensity",1,0.45,1.8);
    POS=POSITION_PRESETS[String(C.orbPosition||"lowerRight")]||POSITION_PRESETS.lowerRight;
  }
  applyConfig({});
  var wrap=document.querySelector(".wrap");
  var orb=document.getElementById("orb"), halo=document.getElementById("halo"), plasma=document.getElementById("plasma");
  var face=document.getElementById("face"), eyeL=document.getElementById("eyeL"), eyeR=document.getElementById("eyeR");
  var browPathL=document.getElementById("browPathL"), browPathR=document.getElementById("browPathR");
  var lipUpper=document.getElementById("lipUpper"), lipLower=document.getElementById("lipLower");
  var mouthInner=document.getElementById("mouthInner"), teeth=document.getElementById("teeth");
  var ring1=document.getElementById("ring1"), ring2=document.getElementById("ring2");
  var starsCanvas=document.getElementById("stars"), fxCanvas=document.getElementById("fx");

  var level=0, mouthLevel=0, burst=0, target=0, prevTarget=0, vel=0;
  var gazeX=0, gazeY=0, saccX=0, saccY=0, nextSaccade=0;
  var nextBlink=0, wasIdle=true;
  var expr="idle", starDots=[], bolts=[];
  var wasSpeaking=false, speakAccent=0, nextAccent=0, microSmile=0, nextDoubleBlink=0;
  var pollTimer=null, bridgeOnline=false, voiceActive=false;

  function rand(a,b){return a+Math.random()*(b-a);}
  function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}

  for(var si=0;si<88;si++){
    starDots.push({
      x:rand(0.08,0.92), y:rand(0.08,0.92), r:rand(0.35,1.45),
      spd:rand(0.0012,0.0038), phase:rand(0,Math.PI*2), phase2:rand(0,Math.PI*2),
      warm:Math.random()>0.72, sparkle:Math.random()>0.82
    });
  }

  function starColor(warm, a){
    return warm?"rgba(255,220,180,"+a+")":"rgba(190,215,255,"+a+")";
  }

  function drawOneStar(ctx, x, y, r, alpha, warm, sparkle, now, phase){
    if(alpha<0.03) return;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=starColor(warm, alpha.toFixed(3));ctx.fill();
    if(sparkle&&alpha>0.22){
      var fl=0.5+0.5*Math.sin(now*0.004+phase);
      if(fl>0.82){
        ctx.strokeStyle=starColor(warm,(alpha*0.35).toFixed(3));
        ctx.lineWidth=0.5;ctx.beginPath();
        ctx.moveTo(x-r*2.2,y);ctx.lineTo(x+r*2.2,y);
        ctx.moveTo(x,y-r*2.2);ctx.lineTo(x,y+r*2.2);ctx.stroke();
      }
    }
  }

  function drawStars(now,e){
    var ctx=starsCanvas.getContext("2d"),w=starsCanvas.width,h=starsCanvas.height,cx=w/2,cy=h/2,r=w*0.48;
    ctx.clearRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,"#040812");g.addColorStop(0.55,"#060c18");g.addColorStop(1,"#0a1228");
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    for(var i=0;i<starDots.length;i++){
      var s=starDots[i];
      var tw=0.55+0.45*Math.sin(now*s.spd+s.phase)+0.15*Math.sin(now*s.spd*2.3+s.phase2);
      var a=clamp(s.r/1.5,0.18,0.65)*tw*(0.9+e*0.06);
      drawOneStar(ctx,s.x*w,s.y*h,s.r*(0.85+tw*0.15),a,s.warm,s.sparkle,now,s.phase);
    }
    ctx.restore();
  }

  nextBlink=performance.now()+rand(2800,4800);
  nextDoubleBlink=performance.now()+rand(12000,20000);
  nextSaccade=performance.now()+rand(3200,5600);

  function doBlink(){
    eyeL.classList.add("blink"); eyeR.classList.add("blink");
    setTimeout(function(){eyeL.classList.remove("blink");eyeR.classList.remove("blink");},130);
  }

  function poll(){
    fetch(LEVEL_SRCS[levelSrc],{cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(d){
      var rawLevel=typeof d.level==="number"?d.level:0;
      var rawTarget=typeof d.target==="number"?d.target:rawLevel;
      var status=String(d.status||"");
      voiceActive=status ? status==="speaking" : (rawTarget>=SPEAK_ON || (voiceActive&&rawTarget>=SPEAK_OFF));
      var nextTarget=voiceActive?clamp(rawLevel*VOICE_SENSITIVITY,0,1):0;
      vel=nextTarget-target; prevTarget=target; target=nextTarget;
      bridgeOnline=true;
      schedulePoll(POLL_MS);
    }).catch(function(){
      vel=0; target=0; voiceActive=false;
      bridgeOnline=false;
      levelSrc=(levelSrc+1)%LEVEL_SRCS.length;
      schedulePoll(RETRY_MS);
    });
  }

  function schedulePoll(delay){
    if(pollTimer) clearTimeout(pollTimer);
    pollTimer=setTimeout(poll,delay);
  }

  function refreshConfig(){
    if(!onHttp) return;
    fetch("/config.json",{cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(d){
      applyConfig(d.config||d);
    }).catch(function(){}).finally(function(){
      setTimeout(refreshConfig,2200);
    });
  }

  function setBrows(lLift,rLift,lCurve,rCurve, pinch){
    var py=5-lLift*4, ry=5-rLift*4;
    var lc=2-lCurve*3, rc=2-rCurve*3;
    browPathL.setAttribute("d","M 2 "+py+" Q 17 "+lc+" 32 "+(py+pinch));
    browPathR.setAttribute("d","M 2 "+(ry+pinch)+" Q 17 "+rc+" 32 "+ry);
  }

  function setMouth(open,w,vowel,smile){
    smile=smile||0;
    var cx=40, uy=18, half=clamp(8+w*15,8,26), jaw=clamp(open*24,0,24);
    var sm=smile*5;
    var roundness=clamp(1-vowel,0,1);
    half=clamp(half*(0.88+roundness*0.16),8,26);
    var lx=cx-half, rx=cx+half;
    var cup=clamp(vowel*3,0,4);
    lipUpper.setAttribute("d","M "+lx+" "+(uy+cup*0.4-sm*0.3)+" Q "+cx+" "+(uy-1-vowel*2-sm)+" "+rx+" "+(uy+cup*0.4-sm*0.3));
    if(open>0.04){
      mouthInner.classList.add("open");
      teeth.classList.toggle("show",open>0.28);
      var ih=uy+2+jaw*0.85;
      lipLower.setAttribute("d","M "+(lx+2)+" "+(uy+1)+" Q "+cx+" "+(uy+3+jaw)+" "+(rx-2)+" "+(uy+1));
      mouthInner.setAttribute("d","M "+(lx+3)+" "+(uy+2)+" L "+(rx-3)+" "+(uy+2)+" Q "+cx+" "+ih+" "+(lx+3)+" "+(uy+2)+" Z");
    } else {
      mouthInner.classList.remove("open"); teeth.classList.remove("show");
      lipLower.setAttribute("d","M "+(lx+5)+" "+(uy+2)+" Q "+cx+" "+(uy+10-vowel*2+sm*0.8)+" "+(rx-5)+" "+(uy+2));
    }
  }

  function applyExpression(name, g, m, speaking){
    eyeL.classList.remove("wide","squint","emphasis"); eyeR.classList.remove("wide","squint","emphasis");
    var e=name;
    if(speaking) e=expr.indexOf("speaking")===0?expr:"speaking";
    if(speaking&&g>0.5&&Math.abs(vel)>0.05) e="surprised";

    var wob=Math.sin(performance.now()*0.011)*0.08*m;
    if(e==="speaking-loud"){
      setBrows(0.72+m*0.38+wob, 0.62+m*0.42-wob, 0.38+m*0.18, 0.32+m*0.2, -0.22*m);
      eyeL.classList.add("wide"); eyeR.classList.add("wide");
    } else if(e==="speaking-soft"){
      setBrows(0.42+m*0.32+wob, 0.52+m*0.28-wob, 0.18+m*0.14, 0.22+m*0.12, -0.12*m);
    } else if(e==="speaking"){
      setBrows(0.55+m*0.38, 0.55+m*0.38, 0.28+m*0.16, 0.28+m*0.16, -0.16*m);
    } else if(e==="surprised"){
      setBrows(0.85, 0.85, 0.42, 0.42, -0.4);
      eyeL.classList.add("wide"); eyeR.classList.add("wide");
    } else if(e==="soft-smile"){
      setBrows(0.2, 0.2, -0.12, -0.12, -0.35);
    } else if(e==="listen"){
      setBrows(0.12, 0.22, 0.08, 0.18, 0.15);
      eyeL.classList.add("wide"); eyeR.classList.add("squint");
    } else if(e==="thoughtful"){
      setBrows(0.38, 0.12, 0.22, -0.05, 0.45);
      eyeR.classList.add("squint");
    } else if(e==="inspect-left"||e==="curious"&&gazeX<0){
      setBrows(0.35, 0.65, 0.5, 0.1, 0.3);
    } else if(e==="inspect-right"||e==="curious"&&gazeX>0){
      setBrows(0.65, 0.35, 0.1, 0.5, 0.3);
    } else if(e==="inspect-up"){
      setBrows(0.75, 0.75, -0.3, -0.3, -0.8);
      eyeL.classList.add("wide"); eyeR.classList.add("wide");
    } else if(e==="inspect-down"||e==="focus"){
      setBrows(-0.15, -0.15, 0.6, 0.6, 1.2);
      eyeL.classList.add("squint"); eyeR.classList.add("squint");
    } else {
      setBrows(0.08, 0.08, 0.15, 0.15, 0);
    }
    if(speakAccent>0.12){
      eyeL.classList.add("emphasis"); eyeR.classList.add("emphasis");
    }
  }

  function updateFace(now,g,m,speaking){
    if(speaking){
      if(g>0.32) expr="speaking-loud";
      else if(g>0.07) expr="speaking-soft";
      else expr="speaking";
      microSmile=clamp(microSmile*0.88+0.18,0,0.55);
      if(Math.abs(vel)>0.045&&now>=nextAccent){speakAccent=1; nextAccent=now+160;}
      speakAccent*=0.86;
    } else {
      expr="idle";
      microSmile*=0.9; speakAccent*=0.82;
    }
    wasSpeaking=speaking;

    if(now>=nextBlink){
      if(!speaking&&now>=nextDoubleBlink){
        doBlink(); setTimeout(doBlink,160); nextDoubleBlink=now+rand(14000,24000);
      } else doBlink();
      nextBlink=now+rand(3800,7600);
    }

    var gt=now*0.00052;
    var tgtX=Math.sin(gt)*0.11+Math.sin(gt*1.41+0.9)*0.05;
    var tgtY=Math.cos(gt*0.88)*0.08+Math.cos(gt*1.18+0.4)*0.04;
    if(speaking){tgtX*=0.35; tgtY*=0.35;}
    var gazeEase=speaking?0.06:0.022;
    gazeX+=(tgtX-gazeX)*gazeEase; gazeY+=(tgtY-gazeY)*gazeEase;

    if(!speaking&&now>=nextSaccade){
      saccX=rand(-0.9,0.9); saccY=rand(-0.65,0.65);
      nextSaccade=now+rand(3800,6800);
    }
    saccX*=0.88; saccY*=0.88;

    var nod=speaking?Math.sin(now*0.018)*0.35*g:0;
    var px=gazeX*14, py=gazeY*11;
    var wiggle=Math.sin(now*0.00115)*1.1+Math.sin(now*0.0023+0.7)*0.55;
    var headTilt=gazeX*5.5+wiggle+(speaking?nod*2.2:0);
    var headYaw=gazeY*-4;
    face.style.transform="translate("+px.toFixed(1)+"px,"+(py+nod*1.2).toFixed(1)+"px) rotate("+headTilt.toFixed(2)+"deg) skewX("+headYaw.toFixed(1)+"deg) scale("+(1+g*0.018+speakAccent*0.01).toFixed(3)+")";

    var epX=gazeX*4.2+saccX+speakAccent*0.35;
    var epY=gazeY*3.4+saccY;
    eyeL.style.setProperty('--ex', (epX-0.5).toFixed(1)+'px');
    eyeL.style.setProperty('--ey', epY.toFixed(1)+'px');
    eyeR.style.setProperty('--ex', (epX+0.5).toFixed(1)+'px');
    eyeR.style.setProperty('--ey', epY.toFixed(1)+'px');

    if(!speaking&&Math.abs(gazeX)>0.07) expr=Math.abs(gazeY)>0.06?"curious":"idle";

    applyExpression(expr,g,m,speaking);

    if(speaking){
      var syll=Math.abs(vel)*12;
      var vowPhase=now*0.034+syll*2.1;
      var vowel=0.35+Math.sin(vowPhase)*0.22+g*0.32;
      var open=clamp(m*1.2+syll*0.65+burst*0.28+g*0.12,0,1);
      var width=clamp(0.35+m*0.7+Math.cos(vowPhase)*0.14+Math.abs(Math.sin(now*0.042+syll*3))*0.2,0.18,1);
      var smile=microSmile*(open<0.45?1:0.35);
      setMouth(open,width,vowel,smile);
    } else {
      setMouth(0,0.35,0.35,0);
    }
  }

  function spawnBolt(e){
    var cx=189,cy=189,a=rand(0,Math.PI*2),r1=rand(118,144),r2=rand(68,94);
    bolts.push({x1:cx+Math.cos(a)*r1,y1:cy+Math.sin(a)*r1,x2:cx+Math.cos(a)*r2,y2:cy+Math.sin(a)*r2,life:rand(0.06,0.14),hue:Math.random()>0.55?32:205});
  }
  function drawBolt(ctx,b,e){
    var mx=(b.x1+b.x2)/2,my=(b.y1+b.y2)/2,jx=mx+rand(-14,14)*e,jy=my+rand(-14,14)*e;
    var alpha=(0.22+e*0.35).toFixed(2);
    ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.quadraticCurveTo(jx,jy,b.x2,b.y2);
    ctx.strokeStyle="hsla("+b.hue+",55%,"+(58+e*10)+"%, "+alpha+")";ctx.lineWidth=0.6+e*0.8;
    ctx.shadowBlur=2+e*4;ctx.shadowColor="hsla("+b.hue+",45%,55%,0.35)";ctx.stroke();ctx.shadowBlur=0;
  }
  function drawFx(now,e,b){
    var ctx=fxCanvas.getContext("2d");ctx.clearRect(0,0,378,378);
    var amp=e+b*0.5;
    if(amp<0.06){bolts.length=0;return;}
    ctx.save();ctx.beginPath();ctx.arc(189,189,139,0,Math.PI*2);ctx.rect(0,0,378,378);ctx.clip("evenodd");
    while(bolts.length<Math.floor(1+amp*4)) spawnBolt(amp);
    for(var i=bolts.length-1;i>=0;i--){
      bolts[i].life-=0.018;if(bolts[i].life<=0){bolts.splice(i,1);continue;}
      drawBolt(ctx,bolts[i],amp);
    }
    ctx.restore();
  }

  function render(now){
    if(!now) now=performance.now();
    level+=(target-level)*(target>level?ATTACK:RELEASE);
    mouthLevel+=(target-mouthLevel)*(target>mouthLevel?MOUTH_ATTACK:MOUTH_RELEASE);
    burst+=((voiceActive?Math.abs(vel)*4:0)-burst)*0.35;
    var speaking=voiceActive&&(level>=IDLE_THRESHOLD||mouthLevel>=IDLE_THRESHOLD);
    if(speaking!==wasIdle){orb.classList.toggle("idle",!speaking);wasIdle=speaking;}
    var g=level, m=mouthLevel;
    var sc=1+g*0.022+burst*0.008;
    var warm=(0.1+g*0.18)*GLOW_INTENSITY;
    orb.style.transform="scale("+sc.toFixed(4)+")";
    orb.style.filter="brightness("+(0.94+g*0.1*GLOW_INTENSITY).toFixed(3)+") saturate("+(1.05+g*0.15*GLOW_INTENSITY).toFixed(2)+")";
    orb.style.boxShadow="0 0 "+(24+g*32*GLOW_INTENSITY).toFixed(0)+"px rgba(232,160,96,"+clamp(0.1+warm,0,0.8).toFixed(2)+"),0 0 "+(38+g*40*GLOW_INTENSITY).toFixed(0)+"px rgba(42,168,216,"+clamp(0.14+g*0.2*GLOW_INTENSITY,0,0.75).toFixed(2)+"),0 0 "+(48+g*46*GLOW_INTENSITY).toFixed(0)+"px rgba(154,74,184,"+clamp(0.1+g*0.14*GLOW_INTENSITY,0,0.7).toFixed(2)+"),inset 0 0 0 2px rgba(42,168,216,"+clamp(0.22+g*0.16*GLOW_INTENSITY,0,0.82).toFixed(2)+"),inset 0 0 36px rgba(0,0,0,0.96)";
    halo.style.transform="scale("+(1+g*0.05*GLOW_INTENSITY).toFixed(3)+")"; halo.style.opacity=clamp(0.35+g*0.28*GLOW_INTENSITY,0,0.9).toFixed(2);
    plasma.style.opacity=clamp(0.5+g*0.22*GLOW_INTENSITY,0,0.92).toFixed(2);
    ring1.style.transform="scale("+(1+g*0.02*GLOW_INTENSITY).toFixed(3)+") rotate("+(g*3).toFixed(1)+"deg)"; ring1.style.opacity=clamp(0.22+g*0.2*GLOW_INTENSITY,0,0.75).toFixed(2);
    ring2.style.transform="scale("+(1+g*0.025*GLOW_INTENSITY).toFixed(3)+") rotate("+(-g*4).toFixed(1)+"deg)"; ring2.style.opacity=clamp(0.18+g*0.16*GLOW_INTENSITY,0,0.7).toFixed(2);
    var floatAmp=speaking?0.92:1;
    var anchorX=POS.x, anchorY=POS.y, roamX=POS.rx, roamY=POS.ry;
    var t=now*0.00105;
    var px=anchorX+Math.sin(t)*roamX*floatAmp;
    var py=anchorY+(Math.sin(t*1.35+0.8)*roamY+Math.sin(t*2.1)*6)*floatAmp;
    var ftilt=Math.sin(t*0.85)*1.1*floatAmp;
    wrap.style.left=px.toFixed(1)+"px";
    wrap.style.top=py.toFixed(1)+"px";
    wrap.style.transform="translate(-50%,-50%) rotate("+ftilt.toFixed(2)+"deg) scale("+ORB_SCALE.toFixed(3)+")";
    drawStars(now,g); drawFx(now,g,burst); updateFace(now,g,m,speaking);
    requestAnimationFrame(render);
  }
  poll(); refreshConfig(); requestAnimationFrame(render);
})();
</script>
</body>
</html>
