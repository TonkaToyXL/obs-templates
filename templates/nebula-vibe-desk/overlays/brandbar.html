<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stream Brand Bar</title>
<style>
  @font-face {
    font-family: "Syne";
    src: url("../fonts/Syne-Variable.ttf") format("truetype");
    font-weight: 600 800;
    font-style: normal;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../fonts/JetBrainsMono-Variable.ttf") format("truetype");
    font-weight: 400 600;
    font-style: normal;
  }
  :root {
    --cyan: #00abfd;
    --violet: #7c4dff;
    --panel: rgba(5, 8, 13, 0.82);
    --ink: #e8f4ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 720px;
    height: 90px;
    background: transparent;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; align-items: flex-start; }
  .bar {
    display: grid;
    grid-template-columns: minmax(0, auto) auto minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    width: 720px;
    height: 64px;
    padding: 11px 34px 11px 17px;
    background: var(--panel);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(232,244,255,0.07);
    border-left: 3px solid var(--cyan);
    clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }
  .bar::before {
    content: "";
    position: absolute;
    inset: 0 26px 0 0;
    background:
      linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.035) 38%, transparent 62%),
      linear-gradient(90deg, rgba(0,171,253,0.07), rgba(124,77,255,0.04) 46%, transparent 86%);
    pointer-events: none;
  }
  .bar::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), transparent 82%); opacity: 0.95;
  }
  .wordmark {
    position: relative;
    z-index: 1;
    min-width: 0;
    max-width: 360px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: "Syne", sans-serif; font-size: 27px; font-weight: 800;
    letter-spacing: 0; line-height: 1;
    background: linear-gradient(105deg, #34c0ff 0%, var(--cyan) 42%, var(--violet) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(0,171,253,0.22));
  }
  .meta {
    position: relative;
    z-index: 1;
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(232,244,255,0.58);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    flex: 0 0 auto;
    padding: 5px 11px;
    border-radius: 999px;
    font-weight: 600;
  }
  .pill.live { background: rgba(0,171,253,0.12); border: 1px solid rgba(0,171,253,0.35); color: #34c0ff; }
  .pill.soon { background: rgba(124,77,255,0.14); border: 1px solid rgba(124,77,255,0.38); color: #b794ff; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.live { background: #ff3b5c; box-shadow: 0 0 10px rgba(255,59,92,0.85); animation: pulse 1.8s ease-in-out infinite; }
  .dot.soon { background: #7c4dff; box-shadow: 0 0 10px rgba(124,77,255,0.85); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.55;transform:scale(.82)} }
  @keyframes breathe { 0%,100%{opacity:.5;transform:scale(.9)} 50%{opacity:1;transform:scale(1.05)} }
  .sep { color: rgba(232,244,255,0.18); }
  .tag {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: rgba(232,244,255,0.50);
    letter-spacing: 0.1em;
  }
  @media (prefers-reduced-motion: reduce) {
    .dot.live, .dot.soon { animation: none; }
  }
</style>
</head>
<body>
  <div class="bar"><span class="wordmark" id="brand">Your Stream</span><span class="meta" id="meta"></span></div>
<script src="branding.js"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var C=window.BRANDING||{};
  var brand=params.get("brand")||C.brandName||"Your Stream";
  var tag=params.get("tag")||C.tagLine||"vibe coding";
  var mode=(params.get("mode")||"live").toLowerCase();
  var cyan=params.get("cyan")||C.accentCyan||"#00abfd";
  var violet=params.get("violet")||C.accentViolet||"#7c4dff";
  document.documentElement.style.setProperty("--cyan", cyan);
  document.documentElement.style.setProperty("--violet", violet);
  var brandEl=document.getElementById("brand");
  brandEl.textContent=brand;
  if(brand.length>24) brandEl.style.fontSize="19px";
  else if(brand.length>17) brandEl.style.fontSize="22px";
  else if(brand.length>12) brandEl.style.fontSize="24px";
  var m=document.getElementById("meta");
  var state=mode==="soon"?"soon":"live";
  var pill=document.createElement("span");
  var dot=document.createElement("span");
  var sep=document.createElement("span");
  var tagEl=document.createElement("span");
  pill.className="pill "+state;
  dot.className="dot "+state;
  sep.className="sep";
  tagEl.className="tag";
  pill.appendChild(dot);
  pill.appendChild(document.createTextNode(state==="soon"?"Starting Soon":"Live"));
  sep.textContent="//";
  tagEl.textContent=tag;
  m.appendChild(pill);
  m.appendChild(sep);
  m.appendChild(tagEl);
})();
</script>
</body>
</html>
