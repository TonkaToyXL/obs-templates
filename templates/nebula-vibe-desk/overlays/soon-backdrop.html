<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family:"Syne"; src:url("fonts/Syne-Variable.ttf") format("truetype"); font-weight:600 800; }
  * { margin:0;padding:0;box-sizing:border-box; }
  html,body { width:100%;height:100%;background:#05080d;overflow:hidden; }
  .bg {
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%,rgba(0,171,253,0.08) 0%,transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 70%,rgba(124,77,255,0.07) 0%,transparent 55%),
      linear-gradient(180deg,#060a12 0%,#05080d 50%,#04060a 100%);
  }
  .grid {
    position:fixed;inset:0;
    background-image:linear-gradient(rgba(0,171,253,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,171,253,0.04) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,black 0%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,black 0%,transparent 75%);
    animation:gridDrift 40s linear infinite;
  }
  @keyframes gridDrift { to { transform:translate(64px,64px); } }
  .title {
    position:fixed;top:68%;left:50%;transform:translate(-50%,-50%);
    font-family:"Syne",sans-serif;font-size:clamp(24px,3.5vw,44px);font-weight:800;
    letter-spacing:0.32em;text-transform:uppercase;color:transparent;
    background:linear-gradient(90deg,rgba(52,192,255,0.4),rgba(124,77,255,0.4));
    -webkit-background-clip:text;background-clip:text;opacity:0.5;
    animation:titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse { 0%,100%{opacity:.38} 50%{opacity:.62} }
</style>
</head>
<body><div class="bg"></div><div class="grid"></div><div class="title">Starting Soon</div></body>
</html>
