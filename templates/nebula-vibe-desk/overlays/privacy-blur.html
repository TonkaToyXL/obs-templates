<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0;padding:0;box-sizing:border-box; }
  html,body { width:100%;height:100%;background:transparent;overflow:hidden;pointer-events:none; }
  .mask-top {
    position:absolute;top:0;left:0;right:0;height:72px;
    backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);
    background:linear-gradient(180deg,rgba(5,8,13,0.72) 0%,rgba(5,8,13,0.28) 62%,rgba(5,8,13,0.04) 100%);
    border-bottom:1px solid rgba(232,244,255,0.06);
  }
  .mask-bottom {
    position:absolute;bottom:0;left:0;right:0;height:156px;
    backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);
    background:linear-gradient(0deg,rgba(5,8,13,0.74) 0%,rgba(5,8,13,0.3) 58%,rgba(5,8,13,0.05) 100%);
    border-top:1px solid rgba(232,244,255,0.06);
  }
  .mask-corner {
    position:absolute;top:0;right:0;width:min(30vw,520px);height:min(16vh,180px);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    background:radial-gradient(circle at 100% 0%,rgba(5,8,13,0.5) 0%,transparent 72%);
    mask-image:radial-gradient(circle at 100% 0%,black 0%,transparent 68%);
    -webkit-mask-image:radial-gradient(circle at 100% 0%,black 0%,transparent 68%);
  }
</style>
</head>
<body>
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
  <div class="mask-corner"></div>
</body>
</html>
