<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0;padding:0;box-sizing:border-box; }
  html,body { width:100%;height:100%;background:transparent;overflow:hidden;pointer-events:none; }
  .mask-top {
    position:absolute;top:0;left:0;right:0;height:38px;
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    background:linear-gradient(180deg,rgba(5,8,13,0.55) 0%,rgba(5,8,13,0.12) 100%);
    border-bottom:1px solid rgba(232,244,255,0.05);
  }
  .mask-corner {
    position:absolute;top:0;right:0;width:min(28vw,480px);height:min(12vh,140px);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    background:radial-gradient(circle at 100% 0%,rgba(5,8,13,0.42) 0%,transparent 72%);
    mask-image:radial-gradient(circle at 100% 0%,black 0%,transparent 68%);
    -webkit-mask-image:radial-gradient(circle at 100% 0%,black 0%,transparent 68%);
  }
</style>
</head>
<body><div class="mask-top"></div><div class="mask-corner"></div></body>
</html>
