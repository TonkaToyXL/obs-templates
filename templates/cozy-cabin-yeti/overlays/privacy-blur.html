<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cabin Privacy Mask</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2560px; height:1440px; background:transparent; overflow:hidden; pointer-events:none; }
  :root {
    --panel:rgba(24,13,10,0.72);
    --line:rgba(255,232,198,0.10);
    --ember:rgba(246,166,67,0.20);
    --snow:rgba(142,215,255,0.12);
  }
  .mask-top {
    position:absolute;
    top:0; left:0; right:0; height:74px;
    backdrop-filter:blur(24px) saturate(132%);
    -webkit-backdrop-filter:blur(24px) saturate(132%);
    background:
      linear-gradient(90deg,var(--ember),transparent 28%,transparent 74%,var(--snow)),
      linear-gradient(180deg,var(--panel),rgba(24,13,10,0.28) 66%,rgba(24,13,10,0));
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 34px rgba(0,0,0,0.22);
  }
  .mask-bottom {
    position:absolute;
    bottom:0; left:0; right:0; height:162px;
    backdrop-filter:blur(24px) saturate(132%);
    -webkit-backdrop-filter:blur(24px) saturate(132%);
    background:
      linear-gradient(90deg,var(--ember),transparent 34%,transparent 72%,var(--snow)),
      linear-gradient(0deg,rgba(24,13,10,0.82),rgba(24,13,10,0.34) 62%,rgba(24,13,10,0));
    border-top:1px solid var(--line);
    box-shadow:0 -18px 42px rgba(0,0,0,0.26);
  }
  .mask-corner {
    position:absolute;
    right:0; bottom:0; width:520px; height:300px;
    background:radial-gradient(circle at 100% 100%,rgba(246,166,67,0.12),transparent 68%);
  }
  @media (prefers-reduced-transparency: reduce) {
    .mask-top,.mask-bottom { backdrop-filter:none; -webkit-backdrop-filter:none; }
  }
</style>
</head>
<body>
  <div class="mask-top"></div>
  <div class="mask-bottom"></div>
  <div class="mask-corner"></div>
</body>
</html>
