<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Cozy Cabin Overlay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2560px; height:1440px; background:transparent; overflow:hidden; }
  canvas { display:block; width:2560px; height:1440px; }
</style>
</head>
<body>
<canvas id="cabin" width="2560" height="1440"></canvas>
<script>
(function(){
  "use strict";
  var W=2560,H=1440;
  var canvas=document.getElementById("cabin");
  var ctx=canvas.getContext("2d");
  var flakes=[], sparks=[];

  function rand(a,b){ return a+Math.random()*(b-a); }
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function init(){
    flakes=[];
    for(var i=0;i<110;i++){
      flakes.push({x:rand(1750,2390),y:rand(115,620),r:rand(1.0,3.0),s:rand(0.35,1.25),d:rand(-0.18,0.22),p:rand(0,6.28)});
    }
    sparks=[];
    for(var j=0;j<46;j++){
      sparks.push({x:rand(210,500),y:rand(1110,1265),r:rand(1,3),vy:rand(0.3,1.2),p:rand(0,6.28),life:rand(0.25,1)});
    }
  }

  function woodGradient(x,y,w,h){
    var g=ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,"rgba(71,38,22,0.54)");
    g.addColorStop(0.45,"rgba(98,52,28,0.44)");
    g.addColorStop(1,"rgba(35,20,15,0.58)");
    return g;
  }

  function drawWoodPanel(x,y,w,h,alpha){
    ctx.save();
    ctx.globalAlpha=alpha;
    roundRect(x,y,w,h,18);
    ctx.fillStyle=woodGradient(x,y,w,h);
    ctx.fill();
    ctx.strokeStyle="rgba(246,166,67,0.12)";
    ctx.lineWidth=1;
    ctx.stroke();
    for(var i=0;i<7;i++){
      var yy=y+18+i*h/7+Math.sin(i*1.8)*8;
      ctx.strokeStyle=i%2?"rgba(255,214,160,0.08)":"rgba(30,14,10,0.18)";
      ctx.beginPath();
      ctx.moveTo(x+24,yy);
      ctx.bezierCurveTo(x+w*0.28,yy-10,x+w*0.58,yy+11,x+w-24,yy-3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFrame(){
    var top=ctx.createLinearGradient(0,0,0,190);
    top.addColorStop(0,"rgba(32,18,12,0.74)");
    top.addColorStop(0.72,"rgba(52,29,18,0.42)");
    top.addColorStop(1,"rgba(52,29,18,0)");
    ctx.fillStyle=top;
    ctx.fillRect(0,0,W,210);

    var bottom=ctx.createLinearGradient(0,H-215,0,H);
    bottom.addColorStop(0,"rgba(42,22,14,0)");
    bottom.addColorStop(0.42,"rgba(42,22,14,0.50)");
    bottom.addColorStop(1,"rgba(24,13,10,0.82)");
    ctx.fillStyle=bottom;
    ctx.fillRect(0,H-215,W,215);

    var left=ctx.createLinearGradient(0,0,300,0);
    left.addColorStop(0,"rgba(38,20,14,0.64)");
    left.addColorStop(1,"rgba(38,20,14,0)");
    ctx.fillStyle=left;
    ctx.fillRect(0,0,320,H);

    var right=ctx.createLinearGradient(W-360,0,W,0);
    right.addColorStop(0,"rgba(20,13,13,0)");
    right.addColorStop(1,"rgba(38,20,14,0.58)");
    ctx.fillStyle=right;
    ctx.fillRect(W-360,0,360,H);

    drawWoodPanel(38,32,760,70,0.72);
    drawWoodPanel(1630,34,860,72,0.70);
    drawWoodPanel(36,1288,820,86,0.66);
    drawWoodPanel(1180,1302,1120,64,0.50);
  }

  function drawWindow(now){
    var x=1768,y=132,w=600,h=404;
    ctx.save();
    roundRect(x-22,y-24,w+44,h+48,22);
    ctx.fillStyle="rgba(38,22,16,0.76)";
    ctx.fill();
    ctx.strokeStyle="rgba(255,220,170,0.16)";
    ctx.lineWidth=2;
    ctx.stroke();

    roundRect(x,y,w,h,12);
    var sky=ctx.createLinearGradient(0,y,0,y+h);
    sky.addColorStop(0,"rgba(53,88,121,0.56)");
    sky.addColorStop(0.58,"rgba(133,168,188,0.38)");
    sky.addColorStop(1,"rgba(233,242,241,0.28)");
    ctx.fillStyle=sky;
    ctx.fill();
    ctx.save();
    roundRect(x,y,w,h,12);
    ctx.clip();

    ctx.fillStyle="rgba(255,251,232,0.48)";
    ctx.beginPath();
    ctx.arc(x+470,y+86,34,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="rgba(62,79,93,0.56)";
    ctx.beginPath();
    ctx.moveTo(x-40,y+h-100);
    ctx.lineTo(x+160,y+185);
    ctx.lineTo(x+350,y+h-100);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle="rgba(80,98,108,0.52)";
    ctx.beginPath();
    ctx.moveTo(x+140,y+h-84);
    ctx.lineTo(x+355,y+162);
    ctx.lineTo(x+w+50,y+h-70);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle="rgba(242,246,241,0.46)";
    ctx.beginPath();
    ctx.moveTo(x+160,y+185);
    ctx.lineTo(x+212,y+260);
    ctx.lineTo(x+116,y+260);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+355,y+162);
    ctx.lineTo(x+421,y+252);
    ctx.lineTo(x+300,y+252);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle="rgba(238,244,238,0.42)";
    ctx.fillRect(x-20,y+h-95,w+40,110);

    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];
      f.y += f.s;
      f.x += Math.sin(now*0.001+f.p)*0.22 + f.d;
      if(f.y>y+h+12){ f.y=y-12; f.x=rand(x+12,x+w-12); }
      if(f.x<x+8) f.x=x+w-8;
      if(f.x>x+w-8) f.x=x+8;
      ctx.fillStyle="rgba(255,255,255,"+(0.28+f.r*0.08).toFixed(3)+")";
      ctx.beginPath();
      ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
    ctx.fillStyle="rgba(41,23,16,0.82)";
    ctx.fillRect(x+w*0.5-9,y,18,h);
    ctx.fillRect(x,y+h*0.5-9,w,18);
    ctx.strokeStyle="rgba(255,240,210,0.18)";
    ctx.lineWidth=3;
    roundRect(x,y,w,h,12);
    ctx.stroke();
    ctx.restore();
  }

  function drawFireplace(now){
    var x=118,y=1002,w=540,h=336;
    ctx.save();
    var glow=1.08+0.22*Math.sin(now*0.006);
    var halo=ctx.createRadialGradient(x+258,y+214,24,x+258,y+214,560);
    halo.addColorStop(0,"rgba(255,213,126,"+(0.52*glow).toFixed(3)+")");
    halo.addColorStop(0.38,"rgba(246,166,67,"+(0.26*glow).toFixed(3)+")");
    halo.addColorStop(1,"rgba(202,82,34,0)");
    ctx.fillStyle=halo;
    ctx.fillRect(0,H-760,1080,760);

    var rg=ctx.createRadialGradient(x+255,y+205,0,x+255,y+205,455);
    rg.addColorStop(0,"rgba(255,194,78,"+(0.48*glow).toFixed(3)+")");
    rg.addColorStop(0.45,"rgba(202,82,34,0.24)");
    rg.addColorStop(1,"rgba(202,82,34,0)");
    ctx.fillStyle=rg;
    ctx.fillRect(0,H-690,1060,690);

    roundRect(x,y,w,h,18);
    ctx.fillStyle="rgba(42,23,17,0.84)";
    ctx.fill();
    ctx.strokeStyle="rgba(255,214,160,0.24)";
    ctx.lineWidth=2;
    ctx.stroke();
    roundRect(x+58,y+46,w-116,h-84,14);
    ctx.fillStyle="rgba(7,4,4,0.54)";
    ctx.fill();
    ctx.strokeStyle="rgba(118,70,42,0.42)";
    ctx.stroke();

    ctx.lineCap="round";
    ctx.strokeStyle="rgba(70,36,20,0.94)";
    ctx.lineWidth=24;
    ctx.beginPath();
    ctx.moveTo(x+170,y+252);
    ctx.lineTo(x+360,y+228);
    ctx.moveTo(x+198,y+225);
    ctx.lineTo(x+430,y+258);
    ctx.stroke();

    for(var i=0;i<5;i++){
      var phase=now*0.004+i*0.9;
      var cx=x+270+i*22-44+Math.sin(phase)*14;
      var base=y+240;
      var fh=152+Math.sin(phase*1.7)*42;
      var fw=48+i*7;
      var fire=ctx.createRadialGradient(cx,base-fh*0.34,0,cx,base-fh*0.38,fh);
      fire.addColorStop(0,"rgba(255,250,204,1)");
      fire.addColorStop(0.34,"rgba(255,187,62,0.94)");
      fire.addColorStop(0.72,"rgba(218,73,31,0.68)");
      fire.addColorStop(1,"rgba(207,67,30,0)");
      ctx.fillStyle=fire;
      ctx.beginPath();
      ctx.moveTo(cx,base-fh);
      ctx.bezierCurveTo(cx-fw,base-fh*0.58,cx-fw*1.1,base-fh*0.2,cx,base);
      ctx.bezierCurveTo(cx+fw*1.12,base-fh*0.24,cx+fw,base-fh*0.56,cx,base-fh);
      ctx.fill();
    }

    ctx.save();
    ctx.globalCompositeOperation="lighter";
    var core=ctx.createRadialGradient(x+270,y+205,8,x+270,y+205,250);
    core.addColorStop(0,"rgba(255,246,176,0.46)");
    core.addColorStop(0.42,"rgba(255,145,42,0.24)");
    core.addColorStop(1,"rgba(255,120,36,0)");
    ctx.fillStyle=core;
    ctx.fillRect(x+48,y+62,w-96,h-92);
    ctx.restore();

    for(var s=0;s<sparks.length;s++){
      var p=sparks[s];
      p.y -= p.vy;
      p.x += Math.sin(now*0.002+p.p)*0.6;
      p.life -= 0.004;
      if(p.y<y+52 || p.life<=0){ p.x=rand(x+170,x+398); p.y=rand(y+204,y+270); p.life=rand(0.35,1); }
      ctx.fillStyle="rgba(255,208,112,"+clamp(p.life,0,0.9).toFixed(3)+")";
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
      ctx.fill();
    }

    roundRect(x-16,y+h-28,w+32,42,12);
    ctx.fillStyle="rgba(63,33,20,0.90)";
    ctx.fill();
    ctx.restore();
  }

  function drawAtmosphere(now){
    var warm=ctx.createRadialGradient(340,1160,0,340,1160,1020);
    warm.addColorStop(0,"rgba(246,166,67,0.32)");
    warm.addColorStop(0.45,"rgba(246,166,67,0.12)");
    warm.addColorStop(1,"rgba(246,166,67,0)");
    ctx.fillStyle=warm;
    ctx.fillRect(0,0,W,H);

    var cool=ctx.createRadialGradient(2070,300,0,2070,300,760);
    cool.addColorStop(0,"rgba(142,215,255,0.08)");
    cool.addColorStop(0.54,"rgba(142,215,255,0.025)");
    cool.addColorStop(1,"rgba(142,215,255,0)");
    ctx.fillStyle=cool;
    ctx.fillRect(0,0,W,H);

    var edge=ctx.createRadialGradient(W*0.52,H*0.50,420,W*0.52,H*0.50,1420);
    edge.addColorStop(0,"rgba(0,0,0,0)");
    edge.addColorStop(1,"rgba(10,5,4,0.24)");
    ctx.fillStyle=edge;
    ctx.fillRect(0,0,W,H);
  }

  function frame(now){
    ctx.clearRect(0,0,W,H);
    drawFrame();
    drawWindow(now||0);
    drawFireplace(now||0);
    drawAtmosphere(now||0);
    requestAnimationFrame(frame);
  }

  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
