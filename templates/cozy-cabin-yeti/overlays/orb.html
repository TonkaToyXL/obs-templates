<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Yeti Voice Orb</title>
<style>
  :root {
    --snow:#8ed7ff;
    --ember:#f6a643;
    --fur:#f5fbff;
    --shade:#bed7e2;
    --ink:#243240;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:2560px; height:1440px; background:transparent; overflow:hidden; }
  .stage { position:relative; width:2560px; height:1440px; overflow:visible; }
  .wrap {
    position:absolute;
    left:1952px;
    top:946px;
    width:420px;
    height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 18px 36px rgba(0,0,0,0.42));
    transform-origin:50% 50%;
    will-change:transform,left,top;
  }
  .aura {
    position:absolute;
    width:386px;
    height:386px;
    border-radius:50%;
    background:
      radial-gradient(circle,rgba(246,166,67,0.32),rgba(142,215,255,0.20) 44%,transparent 72%);
    filter:blur(18px);
    transform:scale(var(--aura,1));
    opacity:var(--aura-opacity,.84);
    will-change:transform,opacity;
  }
  .ring {
    position:absolute;
    width:326px;
    height:326px;
    border-radius:50%;
    border:1px solid rgba(142,215,255,0.22);
    box-shadow:0 0 24px rgba(142,215,255,0.22), inset 0 0 24px rgba(246,166,67,0.12);
    animation:drift 24s linear infinite;
    opacity:.68;
    will-change:opacity,transform;
  }
  .ring::after {
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:conic-gradient(from 30deg,transparent 0 58%,rgba(246,166,67,0.42) 64%,transparent 72% 100%);
    -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%,#000 68%,transparent 70%);
    mask:radial-gradient(circle,transparent 62%,#000 64%,#000 68%,transparent 70%);
  }
  @keyframes drift { to { transform:rotate(360deg); } }
  .orb {
    position:relative;
    width:276px;
    height:276px;
    border-radius:50%;
    transform:scale(var(--orb-scale,1));
    transform-origin:50% 52%;
    transition:filter .08s linear, box-shadow .08s linear;
    will-change:transform,filter,box-shadow;
    background:
      radial-gradient(circle at 32% 22%,rgba(255,255,255,0.96),rgba(255,255,255,0.16) 18%,transparent 30%),
      radial-gradient(circle at 50% 63%,#f7fcff 0%,#edf8ff 42%,#b9d6e4 72%,#68889b 100%);
    box-shadow:
      inset 0 -24px 42px rgba(73,105,123,0.32),
      inset 0 0 0 3px rgba(255,255,255,0.56),
      0 0 48px rgba(142,215,255,0.34),
      0 0 98px rgba(246,166,67,0.20);
    overflow:visible;
  }
  .orb::before {
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:inset 0 12px 20px rgba(255,255,255,0.24);
    pointer-events:none;
  }
  .tuft {
    position:absolute;
    left:50%;
    top:-26px;
    width:112px;
    height:70px;
    transform:translateX(-50%);
    filter:drop-shadow(0 6px 8px rgba(68,95,111,0.18));
  }
  .tuft span {
    position:absolute;
    bottom:0;
    width:42px;
    height:62px;
    border-radius:70% 70% 48% 48%;
    background:linear-gradient(180deg,#fff,#dceff7);
    transform-origin:50% 100%;
  }
  .tuft span:nth-child(1){ left:3px; transform:rotate(-24deg); }
  .tuft span:nth-child(2){ left:34px; height:70px; }
  .tuft span:nth-child(3){ right:3px; transform:rotate(24deg); }
  .ear {
    position:absolute;
    top:92px;
    width:54px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(145deg,#f7fcff,#bad7e4);
    box-shadow:inset 0 -8px 12px rgba(93,125,142,0.22);
    z-index:-1;
  }
  .ear::after {
    content:"";
    position:absolute;
    inset:13px 12px;
    border-radius:50%;
    background:rgba(246,166,67,0.16);
  }
  .ear.left { left:-23px; transform:rotate(-15deg); }
  .ear.right { right:-23px; transform:rotate(15deg); }
  .horn {
    position:absolute;
    top:40px;
    width:40px;
    height:54px;
    border-radius:50% 50% 45% 45%;
    background:linear-gradient(180deg,#ffe5ba,#b98652);
    z-index:-1;
    box-shadow:inset 0 -8px 10px rgba(80,44,21,0.20);
  }
  .horn.left { left:42px; transform:rotate(-26deg); }
  .horn.right { right:42px; transform:rotate(26deg); }
  .face {
    position:absolute;
    left:50%;
    top:52%;
    width:168px;
    height:142px;
    transform:translate(-50%,-50%) translate(var(--face-x,0px),var(--face-y,0px));
  }
  .brow {
    position:absolute;
    top:12px;
    width:42px;
    height:12px;
    border-top:5px solid rgba(84,115,132,0.70);
    border-radius:50%;
  }
  .brow.left { left:20px; transform:rotate(-8deg); }
  .brow.right { right:20px; transform:rotate(8deg); }
  .eye {
    position:absolute;
    top:42px;
    width:24px;
    height:27px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 28%,#fff 0 12%,#253441 13% 100%);
    transform:translate(var(--eye-x,0px),var(--eye-y,0px)) scaleY(var(--blink,1));
    box-shadow:0 0 9px rgba(142,215,255,0.22);
  }
  .eye.left { left:34px; }
  .eye.right { right:34px; }
  .cheek {
    position:absolute;
    top:74px;
    width:34px;
    height:18px;
    border-radius:50%;
    background:rgba(246,166,67,var(--cheek,.16));
    filter:blur(2px);
  }
  .cheek.left { left:18px; }
  .cheek.right { right:18px; }
  .nose {
    position:absolute;
    left:50%;
    top:70px;
    width:30px;
    height:23px;
    transform:translateX(-50%);
    border-radius:44% 44% 54% 54%;
    background:linear-gradient(180deg,#506779,#263746);
    box-shadow:0 3px 0 rgba(255,255,255,0.18) inset;
  }
  .mouth {
    position:absolute;
    left:50%;
    top:88px;
    width:94px;
    height:52px;
    transform:translateX(-50%);
  }
  .mouth svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 6px rgba(246,166,67,0.28)); }
  .mouth-hole { fill:#243240; opacity:var(--mouth-hole,.12); }
  .lip { fill:none; stroke:#243240; stroke-width:5; stroke-linecap:round; }
  .tooth { fill:rgba(255,255,255,0.78); opacity:var(--tooth,.4); }
  .scarf {
    position:absolute;
    left:50%;
    bottom:19px;
    width:174px;
    height:34px;
    transform:translateX(-50%);
    border-radius:999px;
    background:linear-gradient(90deg,#b84230,#f6a643 45%,#b84230);
    box-shadow:0 8px 18px rgba(80,30,15,0.25), inset 0 2px 0 rgba(255,255,255,0.20);
    z-index:5;
  }
  .scarf::after {
    content:"";
    position:absolute;
    right:28px;
    top:22px;
    width:38px;
    height:76px;
    border-radius:16px;
    background:linear-gradient(180deg,#cc4d36,#8d2d24);
    transform:rotate(-8deg);
  }
  .snow-canvas {
    position:absolute;
    inset:0;
    width:276px;
    height:276px;
    border-radius:50%;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.58;
  }
  @media (prefers-reduced-motion: reduce) {
    .ring { animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="wrap" id="wrap">
    <div class="aura" id="aura"></div>
    <div class="ring"></div>
    <div class="orb" id="orb">
      <canvas class="snow-canvas" id="snow" width="276" height="276"></canvas>
      <div class="horn left"></div>
      <div class="horn right"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="tuft"><span></span><span></span><span></span></div>
      <div class="face" id="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left" id="eyeL"></div>
        <div class="eye right" id="eyeR"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="nose"></div>
        <div class="mouth">
          <svg viewBox="0 0 94 52">
            <path class="mouth-hole" id="mouthHole" d="M 28 22 Q 47 22 66 22 Q 47 42 28 22 Z"/>
            <path class="tooth" id="tooth" d="M 38 23 Q 47 25 56 23 L 55 30 Q 47 32 39 30 Z"/>
            <path class="lip" id="lip" d="M 25 22 Q 47 36 69 22"/>
          </svg>
        </div>
      </div>
      <div class="scarf"></div>
    </div>
  </div>
</div>
<script src="branding.js"></script>
<script>
(function(){
  "use strict";
  var C=window.BRANDING||{};
  var params=new URLSearchParams(location.search);
  var demo=params.get("demo")==="1";
  var preview=params.get("preview")==="1";
  var onHttp=(location.protocol==="http:"||location.protocol==="https:");
  var bridgePort=Number(C.bridgePort);
  if(!isFinite(bridgePort)||bridgePort<1) bridgePort=8766;
  var bridgeOrigin="http://127.0.0.1:"+bridgePort;
  var LEVEL_SRCS=onHttp?["/level.json","level-live.json",bridgeOrigin+"/level.json"]:["level-live.json",bridgeOrigin+"/level.json"];
  var levelSrc=0, level=0, mouth=0, target=0, lastFetch=0, nextBlink=0, blink=1, blinkUntil=0;
  var baseScale=1, lastSpeech=-9999, gazeX=0, gazeY=0, targetGazeX=0, targetGazeY=0, nextLook=0;
  var wrap=document.getElementById("wrap"), orb=document.getElementById("orb"), aura=document.getElementById("aura");
  var ring=document.querySelector(".ring"), face=document.getElementById("face");
  var eyeL=document.getElementById("eyeL"), eyeR=document.getElementById("eyeR"), lip=document.getElementById("lip");
  var mouthHole=document.getElementById("mouthHole"), tooth=document.getElementById("tooth");
  var snow=document.getElementById("snow"), sctx=snow.getContext("2d"), dots=[];
  var positions={
    lowerRight:{x:1952,y:946},
    rightEdge:{x:2158,y:956},
    centerRight:{x:2074,y:696},
    lowerCenter:{x:1070,y:946}
  };
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function rand(a,b){return a+Math.random()*(b-a);}
  function cfgNumber(name,fallback,min,max){var v=Number(C[name]);return isFinite(v)?clamp(v,min,max):fallback;}
  function applyConfig(){
    C=Object.assign({},C);
    var pos=positions[String(C.orbPosition||"lowerRight")]||positions.lowerRight;
    var scale=cfgNumber("orbScale",1,0.72,1.4);
    if(preview){
      pos={
        x:clamp(pos.x,24,Math.max(24,window.innerWidth-460)),
        y:clamp(pos.y,24,Math.max(24,window.innerHeight-460))
      };
    }
    baseScale=scale;
    wrap.style.left=pos.x+"px";
    wrap.style.top=pos.y+"px";
    wrap.style.transform="translate(0px,0px) scale("+baseScale+")";
    document.documentElement.style.setProperty("--snow", C.accentCyan||"#8ed7ff");
    document.documentElement.style.setProperty("--ember", C.accentViolet||"#f6a643");
  }
  applyConfig();
  for(var i=0;i<70;i++) dots.push({x:rand(20,256),y:rand(18,250),r:rand(.5,1.6),s:rand(.12,.42),p:rand(0,6.28)});
  function poll(now){
    if(demo){
      target=clamp(0.18+0.48*Math.max(0,Math.sin(now*.004))*Math.max(.15,Math.sin(now*.0013+1.4)),0,1);
      return;
    }
    if(now-lastFetch<66) return;
    lastFetch=now;
    fetch(LEVEL_SRCS[levelSrc],{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("level offline");
      return r.json();
    }).then(function(d){
      var raw=Number(d.level||d.target||0);
      var sens=cfgNumber("voiceSensitivity",1,0.45,2.4);
      target=clamp(raw*sens,0,1);
    }).catch(function(){
      levelSrc=(levelSrc+1)%LEVEL_SRCS.length;
      target*=0.96;
    });
  }
  function drawSnow(now,e){
    sctx.clearRect(0,0,276,276);
    sctx.save();
    sctx.beginPath();
    sctx.arc(138,138,132,0,Math.PI*2);
    sctx.clip();
    for(var i=0;i<dots.length;i++){
      var d=dots[i];
      d.y += d.s*(1+e);
      d.x += Math.sin(now*.001+d.p)*.08;
      if(d.y>258){d.y=16;d.x=rand(22,254);}
      sctx.fillStyle="rgba(255,255,255,"+(0.20+d.r*.15).toFixed(3)+")";
      sctx.beginPath();
      sctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      sctx.fill();
    }
    sctx.restore();
  }
  function updateFace(now,e,alive){
    if(now>nextBlink){ blinkUntil=now+120; nextBlink=now+rand(2600,5200); }
    blink=now<blinkUntil?0.08:1;
    if(now>nextLook){
      targetGazeX=rand(-4.8,4.8);
      targetGazeY=rand(-2.8,2.8);
      nextLook=now+rand(1800,4200)-alive*760;
    }
    var gazeEase=0.034+alive*0.055;
    gazeX += (targetGazeX+e*3.1-gazeX)*gazeEase;
    gazeY += (targetGazeY-e*1.4-gazeY)*gazeEase;
    var lookX=clamp(gazeX+Math.sin(now*.00062)*1.1,-6,6);
    var lookY=clamp(gazeY+Math.sin(now*.00045+1.8)*0.9,-4,4);
    eyeL.style.setProperty("--blink",blink);
    eyeR.style.setProperty("--blink",blink);
    eyeL.style.setProperty("--eye-x",lookX+"px");
    eyeR.style.setProperty("--eye-x",lookX+"px");
    eyeL.style.setProperty("--eye-y",lookY+"px");
    eyeR.style.setProperty("--eye-y",lookY+"px");
    eyeL.style.boxShadow="0 0 "+(9+alive*9).toFixed(1)+"px rgba(142,215,255,"+(0.22+alive*.18).toFixed(3)+")";
    eyeR.style.boxShadow=eyeL.style.boxShadow;
    face.style.setProperty("--face-x",(Math.sin(now*.0011)*1.1+alive*1.6).toFixed(2)+"px");
    face.style.setProperty("--face-y",(Math.sin(now*.0015+1.2)*1.1-alive*0.9).toFixed(2)+"px");
    document.documentElement.style.setProperty("--cheek",(0.16+alive*0.32).toFixed(3));
    var open=clamp(mouth,0,1);
    var lower=24+open*23;
    var width=17+open*10;
    lip.setAttribute("d","M "+(47-width)+" 22 Q 47 "+lower+" "+(47+width)+" 22");
    mouthHole.setAttribute("d","M "+(31-open*5)+" 23 Q 47 "+(22+open*5)+" "+(63+open*5)+" 23 Q 47 "+(32+open*22)+" "+(31-open*5)+" 23 Z");
    tooth.style.setProperty("--tooth",(0.38-open*0.26).toFixed(3));
    mouthHole.style.setProperty("--mouth-hole",(0.10+open*0.88).toFixed(3));
  }
  function frame(now){
    poll(now||0);
    var speaking=target>0.025||level>0.025;
    if(speaking) lastSpeech=now;
    var attack=target>level?0.36:0.10;
    level += (target-level)*attack;
    var mouthTarget=speaking?clamp(target*1.7+Math.max(0,Math.sin(now*.022))*target*.12,0.04,1):0;
    mouth += (mouthTarget-mouth)*(mouthTarget>mouth?0.68:0.18);
    var e=clamp(level,0,1), glow=cfgNumber("glowIntensity",1,0.45,1.8);
    var idlePulse=0.5+0.5*Math.sin(now*.0014+0.7);
    var alive=clamp(e*1.35+(now-lastSpeech<900?0.18:0),0,1);
    var floatX=Math.sin(now*.00055)*5+Math.sin(now*.00017+1.4)*2;
    var floatY=Math.sin(now*.00072+0.8)*7-alive*2.5;
    var tilt=Math.sin(now*.00048)*1.15+alive*.45;
    wrap.style.transform="translate("+floatX.toFixed(2)+"px,"+floatY.toFixed(2)+"px) scale("+baseScale+") rotate("+tilt.toFixed(2)+"deg)";
    orb.style.setProperty("--orb-scale",(1+alive*.055).toFixed(3));
    aura.style.setProperty("--aura",(1.035+idlePulse*.035+alive*.30*glow).toFixed(3));
    aura.style.setProperty("--aura-opacity",clamp(0.70+idlePulse*.06+alive*.26*glow,0.58,0.98).toFixed(3));
    if(ring) ring.style.opacity=clamp(0.68+idlePulse*.06+alive*.24,0.55,0.92).toFixed(3);
    orb.style.filter="brightness("+(1.025+idlePulse*.015+alive*.11).toFixed(3)+") saturate("+(1.035+alive*.09).toFixed(3)+")";
    orb.style.boxShadow=[
      "inset 0 -24px 42px rgba(73,105,123,0.32)",
      "inset 0 0 0 3px rgba(255,255,255,0.56)",
      "0 0 "+(46+idlePulse*10+alive*30*glow).toFixed(1)+"px rgba(142,215,255,"+(0.32+alive*.16*glow).toFixed(3)+")",
      "0 0 "+(92+idlePulse*16+alive*46*glow).toFixed(1)+"px rgba(246,166,67,"+(0.18+alive*.09*glow).toFixed(3)+")"
    ].join(",");
    updateFace(now,e,alive);
    drawSnow(now,e);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
