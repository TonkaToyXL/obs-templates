<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Cabin Config</title>
<style>
  @font-face {
    font-family: "Syne";
    src: url("../fonts/Syne-Variable.ttf") format("truetype");
    font-weight: 600 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../fonts/JetBrainsMono-Variable.ttf") format("truetype");
    font-weight: 400 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #120b09;
    --panel: #21130e;
    --panel2: #2a1811;
    --line: rgba(255,238,210,0.13);
    --text: #fff6e8;
    --muted: #bfae9a;
    --cyan: #8ed7ff;
    --violet: #f6a643;
    --green: #5dffbd;
    --amber: #ffd166;
    --red: #ff6b7a;
    --field: #07101a;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Syne", system-ui, sans-serif;
    padding: 28px;
    background:
      radial-gradient(ellipse 78% 50% at 14% 0%, rgba(246,166,67,0.12), transparent 58%),
      radial-gradient(ellipse 60% 46% at 94% 100%, rgba(142,215,255,0.12), transparent 54%),
      linear-gradient(rgba(255,238,210,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,238,210,0.025) 1px, transparent 1px),
      var(--bg);
    background-size: auto, auto, 34px 34px, 34px 34px, auto;
  }
  .shell { width: min(1080px, 100%); margin: 0 auto; }
  header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); line-height: 0.95; letter-spacing: 0; }
  .sub { margin: 10px 0 0; color: var(--muted); font: 13px/1.6 "JetBrains Mono", ui-monospace, monospace; }
  .status-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--muted);
    background: rgba(232,244,255,0.04);
    font: 700 12px/1 "JetBrains Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .pill.ok { color: #001a12; background: var(--green); border-color: var(--green); }
  .pill.warn { color: #231600; background: var(--amber); border-color: var(--amber); }
  .pill.bad { color: #250006; background: var(--red); border-color: var(--red); }
  form { margin-top: 20px; display: grid; gap: 14px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .panel {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)), var(--panel);
    padding: 16px;
  }
  .panel-title {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
    color: var(--muted);
    font: 700 11px/1 "JetBrains Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .fields { display: grid; gap: 12px; }
  .field { display: grid; gap: 7px; }
  .field.split { grid-template-columns: 1fr auto; align-items: end; column-gap: 12px; }
  label {
    color: var(--muted);
    font: 700 12px/1 "JetBrains Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  input, select, button {
    font: 600 15px/1.2 "Syne", system-ui, sans-serif;
  }
  input[type="text"], select {
    width: 100%;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    background: var(--field);
    padding: 10px 12px;
    outline: none;
  }
  input[type="text"]:focus, select:focus {
    border-color: rgba(0,171,253,0.7);
    box-shadow: 0 0 0 3px rgba(0,171,253,0.12);
  }
  .color-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; }
  input[type="color"] {
    width: 46px;
    height: 44px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--cyan);
  }
  output {
    min-width: 54px;
    color: var(--text);
    text-align: right;
    font: 700 13px/1 "JetBrains Mono", ui-monospace, monospace;
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(232,244,255,0.035);
  }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    min-height: 40px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 13px;
    color: var(--text);
    background: var(--panel2);
    cursor: pointer;
  }
  button.primary {
    color: #00131f;
    background: var(--cyan);
    border-color: var(--cyan);
    font-weight: 800;
  }
  button:disabled { cursor: wait; opacity: 0.68; }
  .save-state {
    color: var(--muted);
    font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace;
    overflow-wrap: anywhere;
  }
  .links { display: flex; gap: 12px; flex-wrap: wrap; }
  a {
    color: var(--cyan);
    text-decoration: none;
    font: 700 12px/1.5 "JetBrains Mono", ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  a:hover { text-decoration: underline; }
  .error {
    display: none;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid rgba(255,107,122,0.28);
    color: #ffc8cf;
    background: rgba(255,107,122,0.07);
    font: 13px/1.55 "JetBrains Mono", ui-monospace, monospace;
    overflow-wrap: anywhere;
  }
  @media (max-width: 820px) {
    body { padding: 20px; }
    header { align-items: start; flex-direction: column; }
    .status-row { justify-content: flex-start; }
    .grid { grid-template-columns: 1fr; }
    .actions { align-items: start; flex-direction: column; }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <h1>Cabin Config</h1>
      <p class="sub">Local controls for brand, mic, and Yeti orb tuning.</p>
    </div>
    <div class="status-row">
      <span class="pill warn" id="bridge">Bridge</span>
      <span class="pill warn" id="obs">OBS</span>
      <span class="pill warn" id="meter">Meter</span>
    </div>
  </header>

  <form id="configForm">
    <section class="grid">
      <div class="panel">
        <div class="panel-title">Brand</div>
        <div class="fields">
          <div class="field">
            <label for="brandName">Name</label>
            <input id="brandName" name="brandName" type="text" maxlength="48" autocomplete="off" />
          </div>
          <div class="field">
            <label for="tagLine">Tag</label>
            <input id="tagLine" name="tagLine" type="text" maxlength="72" autocomplete="off" />
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Signal</div>
        <div class="fields">
          <div class="field">
            <label for="micInputName">Mic Input</label>
            <input id="micInputName" name="micInputName" type="text" maxlength="120" autocomplete="off" />
          </div>
          <div class="field">
            <label for="accentCyan">Cyan Accent</label>
            <div class="color-row">
              <input id="accentCyan" name="accentCyan" type="color" />
              <input id="accentCyanText" type="text" maxlength="7" autocomplete="off" />
            </div>
          </div>
          <div class="field">
            <label for="accentViolet">Ember Accent</label>
            <div class="color-row">
              <input id="accentViolet" name="accentViolet" type="color" />
              <input id="accentVioletText" type="text" maxlength="7" autocomplete="off" />
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Orb Position</div>
        <div class="fields">
          <div class="field">
            <label for="orbPosition">Preset</label>
            <select id="orbPosition" name="orbPosition">
              <option value="lowerRight">Lower Right</option>
              <option value="rightEdge">Right Edge</option>
              <option value="centerRight">Center Right</option>
              <option value="lowerCenter">Lower Center</option>
            </select>
          </div>
          <div class="field split">
            <div>
              <label for="orbScale">Scale</label>
              <input id="orbScale" name="orbScale" type="range" min="0.72" max="1.4" step="0.01" />
            </div>
            <output for="orbScale" id="orbScaleValue">1.00</output>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Orb Response</div>
        <div class="fields">
          <div class="field split">
            <div>
              <label for="voiceSensitivity">Voice Sensitivity</label>
              <input id="voiceSensitivity" name="voiceSensitivity" type="range" min="0.45" max="2.4" step="0.01" />
            </div>
            <output for="voiceSensitivity" id="voiceSensitivityValue">1.00</output>
          </div>
          <div class="field split">
            <div>
              <label for="glowIntensity">Glow</label>
              <input id="glowIntensity" name="glowIntensity" type="range" min="0.45" max="1.8" step="0.01" />
            </div>
            <output for="glowIntensity" id="glowIntensityValue">1.00</output>
          </div>
        </div>
      </div>
    </section>

    <div class="error" id="error"></div>

    <section class="actions">
      <div>
        <div class="save-state" id="saveState">Loading config...</div>
        <div class="links">
          <a href="/health.html">Health</a>
          <a href="/overlays/orb.html">Orb</a>
          <a href="/config.json">JSON</a>
        </div>
      </div>
      <div class="buttons">
        <button type="button" id="reloadBtn">Reload</button>
        <button type="submit" class="primary" id="saveBtn">Save</button>
      </div>
    </section>
  </form>
</main>

<script>
(function(){
  "use strict";
  var fields=[
    "brandName","tagLine","accentCyan","accentViolet",
    "micInputName","orbPosition","orbScale","voiceSensitivity","glowIntensity"
  ];
  var numeric=["orbScale","voiceSensitivity","glowIntensity"];
  var form=document.getElementById("configForm");
  var saveBtn=document.getElementById("saveBtn");
  var reloadBtn=document.getElementById("reloadBtn");
  var saveState=document.getElementById("saveState");
  var error=document.getElementById("error");
  var bridge=document.getElementById("bridge");
  var obs=document.getElementById("obs");
  var meter=document.getElementById("meter");

  function el(id){return document.getElementById(id);}
  function clamp(v,min,max){return v<min?min:v>max?max:v;}
  function showError(msg){
    error.style.display=msg?"block":"none";
    error.textContent=msg||"";
  }
  function setPill(node, kind, text){
    node.className="pill "+kind;
    node.textContent=text;
  }
  function setState(text){ saveState.textContent=text; }
  function syncRange(id){
    var input=el(id), out=el(id+"Value");
    if(out) out.textContent=Number(input.value||0).toFixed(2);
  }
  function syncColor(name, source){
    var color=el(name), text=el(name+"Text");
    if(source==="text"){
      var v=text.value.trim();
      if(/^#[0-9a-fA-F]{6}$/.test(v)) color.value=v;
    } else {
      text.value=color.value;
    }
  }
  function fill(config){
    fields.forEach(function(name){
      var node=el(name);
      if(!node) return;
      if(config[name]!==undefined && config[name]!==null) node.value=config[name];
    });
    ["accentCyan","accentViolet"].forEach(function(name){ syncColor(name); });
    numeric.forEach(syncRange);
    setState("Config loaded");
  }
  function payload(){
    var out={};
    fields.forEach(function(name){
      var node=el(name);
      if(!node) return;
      out[name]=numeric.indexOf(name)>=0 ? Number(node.value) : node.value;
    });
    out.orbScale=clamp(out.orbScale,0.72,1.4);
    out.voiceSensitivity=clamp(out.voiceSensitivity,0.45,2.4);
    out.glowIntensity=clamp(out.glowIntensity,0.45,1.8);
    return out;
  }
  function load(){
    showError("");
    setState("Loading config...");
    return fetch("/config.json",{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("config request failed");
      return r.json();
    }).then(function(d){
      fill(d.config||d);
    }).catch(function(err){
      setState("Config unavailable");
      showError(err.message||String(err));
    });
  }
  function save(){
    saveBtn.disabled=true;
    setState("Saving...");
    showError("");
    fetch("/config.json",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({config:payload()})
    }).then(function(r){
      return r.json().then(function(d){
        if(!r.ok||d.ok===false) throw new Error(d.error||JSON.stringify(d.errors||{}));
        return d;
      });
    }).then(function(d){
      fill(d.config||d);
      setState("Saved");
    }).catch(function(err){
      setState("Save failed");
      showError(err.message||String(err));
    }).finally(function(){
      saveBtn.disabled=false;
    });
  }
  function pollHealth(){
    fetch("/health.json",{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("health failed");
      return r.json();
    }).then(function(d){
      setPill(bridge,"ok","Bridge");
      setPill(obs,d.obs_connected?"ok":"warn",d.obs_connected?"OBS":"OBS");
      setPill(meter,d.meter_seen?"ok":"warn",d.meter_seen?"Meter":"Meter");
    }).catch(function(){
      setPill(bridge,"bad","Bridge");
      setPill(obs,"warn","OBS");
      setPill(meter,"warn","Meter");
    }).finally(function(){
      setTimeout(pollHealth,1500);
    });
  }

  numeric.forEach(function(name){
    el(name).addEventListener("input",function(){ syncRange(name); setState("Unsaved changes"); });
  });
  ["accentCyan","accentViolet"].forEach(function(name){
    el(name).addEventListener("input",function(){ syncColor(name); setState("Unsaved changes"); });
    el(name+"Text").addEventListener("input",function(){ syncColor(name,"text"); setState("Unsaved changes"); });
  });
  fields.forEach(function(name){
    var node=el(name);
    if(node && numeric.indexOf(name)<0 && name!=="accentCyan" && name!=="accentViolet"){
      node.addEventListener("input",function(){ setState("Unsaved changes"); });
    }
  });
  form.addEventListener("submit",function(event){ event.preventDefault(); save(); });
  reloadBtn.addEventListener("click",load);
  load();
  pollHealth();
})();
</script>
</body>
</html>
