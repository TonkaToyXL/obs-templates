name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zip
          python3 -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Sync shared + compile
        run: |
          ./scripts/sync-shared.sh
          python3 -m py_compile scripts/*.py templates/_shared/bridge/orb-bridge.py
          bash -n scripts/*.sh templates/_shared/bridge/start-bridge.sh

      - name: Package templates
        run: ./scripts/package.sh

      - name: Pytest
        run: python3 -m pytest -q
