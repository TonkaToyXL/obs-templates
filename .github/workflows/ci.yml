name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zip
          python3 -m pip install --upgrade pip pytest

      - name: Sync shared + compile
        run: |
          ./scripts/sync-shared.sh
          python3 -m py_compile scripts/*.py templates/_shared/bridge/orb-bridge.py
          bash -n scripts/*.sh templates/_shared/bridge/start-bridge.sh

      - name: Package templates
        run: ./scripts/package.sh

      - name: Pytest
        run: python3 -m pytest -q
